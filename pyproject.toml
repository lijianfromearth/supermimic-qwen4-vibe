[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermimic"
version = "0.1.0"
description = "Reproduction of SuperMimic (arXiv:2610.28480) on mjlab"
requires-python = ">=3.11"
dependencies = ["mjlab[cu130]"]

[tool.hatch.build.targets.wheel]
packages = ["src/supermimic"]

# The GPU nodes cannot reach pypi.org or github.com, so mjlab is vendored and the
# default index is a full mirror.  torch and warp-lang come from their own indexes
# because the mirror lags behind the versions mjlab requires.
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
mjlab = { path = "vendor/mjlab", editable = true }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[tool.ruff]
src = ["src"]
indent-width = 2
line-length = 88
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]